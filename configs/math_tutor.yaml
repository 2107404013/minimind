# MiniMind-Math-Lab unified project config.
# This YAML is a reproducibility record and a shared source for helper scripts.
# MiniMind official trainer scripts still use argparse.

project:
  name: MiniMind-Math-Lab
  description: 小参数语言模型数学能力边界实验
  repo_root: .
  base_model: MiniMind
  model_size:
    hidden_size: 768
    num_hidden_layers: 8
    use_moe: 0

environment:
  local_machine: single RTX 5060 laptop
  lab_machine: dual RTX 4090
  local_python: D:/APP/Anaconda3/envs/minimind/python.exe
  default_device: cuda:0
  local_cuda_visible_devices: "0"

paths:
  official_pretrain_dataset: dataset/pretrain_t2t_mini.jsonl
  official_sft_dataset: dataset/sft_t2t_mini.jsonl
  mini_pretrain_weight: out/pretrain_768.pth
  mini_pretrain_resume: checkpoints/pretrain_768_resume.pth
  stage1_sft_weight: out/full_sft_768.pth
  stage1_sft_resume: checkpoints/full_sft_768_resume.pth
  math_raw_sample: sample_data/math_raw_sample.jsonl
  math_sft_sample: sample_data/math_sft_sample.jsonl
  sample_docs_dir: sample_docs
  rag_index_sample: outputs/rag/math_notes_sample.index.json

data:
  raw_path: data/raw/math_raw.jsonl
  sft_path: data/processed/math_sft.jsonl
  formatted_teacher_path: outputs/teacher_5000_train_formatted.jsonl
  compact_teacher_path: outputs/teacher_5000_train_compact.jsonl
  sample_raw_path: sample_data/math_raw_sample.jsonl
  sample_sft_path: sample_data/math_sft_sample.jsonl
  user_template: "请解答下面的数学题，并给出清晰的解题步骤：\n{question}"
  final_answer_prefix: "答案是："
  compact_answer_template: "解：最终结果为 {final_answer}。\n{answer_prefix}{final_answer}"
  filters:
    min_question_chars: 2
    min_answer_chars: 2
    max_question_chars: 2048
    max_answer_chars: 4096
    max_total_chars: 6144
  split:
    train_ratio: 0.9
    valid_ratio: 0.05
    test_ratio: 0.05
    seed: 42
  split_paths:
    train: data/processed/math_sft_train.jsonl
    valid: data/processed/math_sft_valid.jsonl
    test: data/processed/math_sft_test.jsonl

official_scripts:
  pretrain: trainer/train_pretrain.py
  sft: trainer/train_full_sft.py
  lora: trainer/train_lora.py
  distill: trainer/train_distillation.py
  inference: eval_llm.py

training:
  official_sft:
    script: trainer/train_full_sft.py
    base_checkpoint: out/pretrain_768.pth
    train_file: dataset/sft_t2t_mini.jsonl
    valid_file: null
    output_dir: out
    from_weight: pretrain
    save_weight: full_sft
    output_checkpoint: out/full_sft_768.pth
    resume_checkpoint: checkpoints/full_sft_768_resume.pth
    learning_rate: 0.00001
    batch_size: 8
    gradient_accumulation_steps: 4
    max_seq_len: 768
    epochs: 2
    save_steps: 1000
    resume: false
    dtype: float16
    num_workers: 4
    log_interval: 100
    grad_clip: 1.0
    recommended_gpu: single RTX 5060 for local run, dual RTX 4090 on Linux or WSL2 later

  math_sft:
    script: trainer/train_full_sft.py
    base_checkpoint: out/full_sft_official_768.pth
    train_file: outputs/teacher_5000_train.jsonl
    valid_file: null
    output_dir: out
    output_checkpoint: out/full_sft_math_official_5000_768.pth
    resume_checkpoint: checkpoints/full_sft_math_official_5000_768_resume.pth
    train_log: null
    from_weight: null
    save_weight: full_sft_math_official_5000
    learning_rate: 0.00001
    batch_size: 1
    gradient_accumulation_steps: 4
    max_seq_len: 768
    epochs: 1
    warmup_ratio: 0.03
    save_steps: 1000
    eval_steps: 1000
    resume: false
    dtype: float16
    num_workers: 4
    log_interval: 100
    grad_clip: 1.0
    note: Reuses MiniMind official trainer/train_full_sft.py. from_weight is derived from base_checkpoint when null; valid_file, warmup_ratio, and eval_steps are recorded for reproducibility but are not consumed by the official script.

  math_lora:
    script: trainer/train_lora.py
    data_path: data/processed/math_sft.jsonl
    from_weight: full_sft_math
    save_dir: out
    lora_name: lora_math
    batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 0.0001
    epochs: 3
    max_seq_len: 768
    save_steps: 1000
    resume: false
    dtype: float16
    num_workers: 4

  candidate_kl:
    status: black_box_design
    candidates_per_question: 4
    output_path: outputs/math_blackbox_preferences.jsonl
    note: Do not use token-level white-box KL for Qwen-to-MiniMind because tokenizers differ. Prepare candidate-level preference data for later DPO or ranking loss instead.

debug:
  overfit_samples: 100
  overfit_epochs: 3
  overfit_learning_rate: 0.00005
  overfit_gradient_accumulation_steps: 1
  overfit_save_steps: 1000
  format_overfit_data: true
  final_answer_prefix: "答案是："
  debug_eval_samples: 20
  save_debug_predictions: outputs/debug_predictions.jsonl

teacher:
  model_name: Qwen2.5-Math-7B-Instruct
  model_name_or_path: Qwen/Qwen2.5-Math-7B-Instruct
  input_path: sample_data/math_sft_sample.jsonl
  output_path: outputs/sample_teacher.jsonl
  failed_path: outputs/failed_teacher.jsonl
  prompt: "你是一名严谨的数学老师。请一步一步推理，最后用‘答案是：...’给出最终答案。"
  load_in_4bit: false
  local_files_only: true
  resume: true
  limit: null
  max_new_tokens: 1024
  temperature: 0.2
  top_p: 0.95
  official_sft_compatible: false
  status: code supports local or cached HF model; no model weights are downloaded by default

rag:
  docs_dir: sample_docs
  chunk_size_chars: 700
  chunk_overlap_chars: 120
  index_path: outputs/rag/math_notes_sample.index.json

evaluation:
  test_file: data/processed/math_sft_test.jsonl
  sample_questions: sample_data/math_sft_sample.jsonl
  boundary_eval_file: outputs/eval_boundary_core.jsonl
  report_path: outputs/math_eval_report.json
  boundary_report_path: outputs/math_boundary_report.json
  difficulty_buckets:
    - arithmetic
    - template_word_problem
    - gsm8k_easy
    - gsm8k_medium
    - hard_reasoning
  boundary:
    items_per_bucket: 10
    pass_threshold: 0.8
    partial_threshold: 0.5
  max_new_tokens: 1024
  temperature: 0.85
  top_p: 0.95
  do_sample: true
  open_thinking: false
  answer_prefix: "答案是"

archive:
  old_math_tutor_files: archive/math_tutor_old
